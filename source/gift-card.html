<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your gift card — Maison Eviève</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --black: #000; --white: #fff; --charcoal: #636363; --grey: #F0EFEC; --cream: #F5F1EA; --blue: #2c3e66; --serif: 'Fraunces', serif; --sans: 'Inter', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--grey); color: var(--black); font-family: var(--sans); min-height: 100vh; padding: 56px 16px 80px; display: flex; flex-direction: column; align-items: center; }
  .intro { max-width: 520px; text-align: center; }
  .intro h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(1.8rem, 5vw, 2.4rem); }
  .intro p { margin-top: 16px; line-height: 1.7; color: #2b2b2b; }
  .actions { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-block; font-family: var(--serif); font-size: 15px; background: transparent; color: var(--black); border: 2px solid var(--black); padding: 12px 28px; text-decoration: none; cursor: pointer; }
  .btn.dark { background: var(--black); color: var(--white); }
  .card { display: none; margin-top: 40px; width: 100%; max-width: 420px; aspect-ratio: 148 / 210; background: #fffdf9; box-shadow: 0 8px 30px rgba(0,0,0,0.12); position: relative; overflow: hidden; }
  .card.show { display: block; }
  .card .toile { position: absolute; left: 0; right: 0; top: 0; height: 28%; background: url(images/toile_de_jouy_maison_evieve.png) center / cover; }
  .card .toile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255,253,249,0) 55%, #fffdf9); }
  .card .inner { position: absolute; left: 10%; right: 10%; top: 30%; bottom: 7%; display: flex; flex-direction: column; align-items: center; text-align: center; color: var(--blue); }
  .card .xmas { font-family: var(--serif); font-style: italic; font-size: 0.95rem; letter-spacing: 0.04em; }
  .card .for { margin-top: 6%; font-family: var(--serif); font-size: 0.9rem; letter-spacing: 0.12em; text-transform: uppercase; }
  .card .name { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: clamp(1.8rem, 7vw, 2.4rem); line-height: 1.2; margin-top: 4px; }
  .card .rule { width: 40px; height: 1px; background: var(--blue); opacity: 0.5; margin: 8% 0; }
  .card .what { font-family: var(--serif); font-size: 1.15rem; line-height: 1.35; }
  .card .body { margin-top: 12px; font-family: var(--serif); font-size: 0.85rem; line-height: 1.6; color: #3d4b6b; }
  .card .from { margin-top: auto; font-family: var(--serif); font-style: italic; font-size: 0.95rem; }
  .card .from span { display: block; font-size: 1.2rem; margin-top: 2px; }
  .card .brand { position: absolute; bottom: 3%; left: 0; right: 0; text-align: center; font-family: var(--sans); font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--charcoal); }
  .signoff { margin-top: 40px; font-family: var(--serif); font-style: italic; text-align: center; color: var(--charcoal); max-width: 420px; line-height: 1.6; }
  .signoff span { display: block; margin-top: 10px; font-style: normal; color: var(--black); }
  @media print {
    @page { size: A5 portrait; margin: 0; }
    body { background: #fff; padding: 0; display: block; }
    .intro, .signoff { display: none !important; }
    .card { margin: 0; max-width: none; width: 148mm; height: 210mm; aspect-ratio: auto; box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <div class="intro">
    <h1 id="gcTitle">Finding your order…</h1>
    <p id="gcText"></p>
    <div class="actions">
      <button class="btn dark" id="gcPrint" style="display:none">Print the card</button>
      <a class="btn" href="/en/">Return to Maison Eviève</a>
    </div>
  </div>

  <div class="card" id="gcCard" aria-label="Gift card">
    <div class="toile"></div>
    <div class="inner">
      <p class="xmas" id="gcXmas"></p>
      <p class="for">For</p>
      <p class="name" id="gcRecipient"></p>
      <div class="rule"></div>
      <p class="what" id="gcWhat"></p>
      <p class="body" id="gcBody"></p>
      <p class="from">With love,<span id="gcGiver"></span></p>
    </div>
    <p class="brand">Maison Eviève · Paris</p>
  </div>

  <p class="signoff">Remember to take as much time as you need, and meet me at the next one.<span>Love,<br>Evi</span></p>

<script>
  (function () {
    var T = {"title": "Your gift card", "loading": "Finding your order…", "thanks_h": "Thank you.", "thanks_p": "Your order is confirmed. A receipt from Stripe is on its way to your inbox, and I'll pack everything by hand.", "gift_h": "Your gift card is ready.", "gift_p": "Print it at home on A5 or A4 paper, fold it if you like, and give it on the day. The wrapped package travels separately, to her door.", "print": "Print the card", "back": "Return to Maison Eviève", "for_": "For", "from_": "With love,", "l12": "A year of “(letters) On Art”", "l6": "Six months of “(letters) On Art”", "art": "A piece of art, on its way to you", "body_letters": "A letter every month, and each season the magazine “(meditating) On Art”, sent from Paris to your door.", "body_art": "Hand-finished and signed in Paris, wrapped in satin ribbon, with a meditation letter of its own.", "xmas": "Merry Christmas", "err": "I couldn't find this order. If you've just paid, wait a minute and reload the page, or write to bonjour@maisonevieve.com and I'll send your card by email.", "signoff": "Remember to take as much time as you need, and meet me at the next one.", "love": "Love,"};
    var API = 'https://studio.maisonevieve.com/gift-card';
    var q = new URLSearchParams(window.location.search);
    var sid = q.get('session_id') || '';
    function $(id) { return document.getElementById(id); }
    function thanks() { $('gcTitle').textContent = T.thanks_h; $('gcText').textContent = T.thanks_p; }
    if (!/^cs_/.test(sid)) { thanks(); return; }
    fetch(API + '?session_id=' + encodeURIComponent(sid)).then(function (r) { return r.json(); }).then(function (d) {
      var g = d && d.gift;
      if (!g) { if (d && d.error) { $('gcTitle').textContent = T.thanks_h; $('gcText').textContent = T.err; } else thanks(); return; }
      if (g.lang && g.lang !== "en") { window.location.replace('/' + g.lang + '/gift-card.html?session_id=' + encodeURIComponent(sid)); return; }
      $('gcTitle').textContent = T.gift_h;
      $('gcText').textContent = T.gift_p;
      $('gcRecipient').textContent = g.recipient_name || '';
      $('gcGiver').textContent = g.giver_name || '';
      $('gcWhat').textContent = g.option === '12' ? T.l12 : g.option === '6' ? T.l6 : T.art;
      $('gcBody').textContent = g.option ? T.body_letters : T.body_art;
      var m = new Date().getMonth();
      if (m === 10 || m === 11) $('gcXmas').textContent = T.xmas;
      $('gcCard').classList.add('show');
      $('gcPrint').style.display = 'inline-block';
    }).catch(function () { $('gcTitle').textContent = T.thanks_h; $('gcText').textContent = T.err; });
    $('gcPrint').addEventListener('click', function () { window.print(); });
  })();
</script>
</body>
</html>
