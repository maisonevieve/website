<script>
  // Points EN/FR to the equivalent page in the other language, falling back to
  // the English homepage if this exact page has no French version (yet).
  (function () {
    var path = window.location.pathname;
    var isFr = path.indexOf('/fr/') !== -1;
    var enPath = isFr ? path.replace('/fr/', '/en/') : path;
    var frPath = isFr ? path : path.replace('/en/', '/fr/');
    var enLink = document.querySelector('.lang-en');
    var frLink = document.querySelector('.lang-fr');
    if (enLink) { enLink.href = enPath; enLink.classList.toggle('active', !isFr); }
    if (frLink) { frLink.href = frPath; frLink.classList.toggle('active', isFr); }
  })();
</script>
