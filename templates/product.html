<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} · Maison Eviève</title>
{{OG_TAGS}}
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000; --white: #FFFFFF; --charcoal: #636363;
    --grey: #F0EFEC; --cream: #F5F1EA;
    --serif: 'Fraunces', serif; --sans: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--white); color: var(--black); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; animation: pageFadeIn 0.7s ease both; }
  @keyframes pageFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes headerFadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { body, header { animation: none; } }
  a { color: inherit; }
  img, video { display: block; max-width: 100%; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
  @media (min-width: 900px) { .wrap { padding: 0 64px; } }

  .btn { display: inline-block; font-family: var(--serif); text-transform: capitalize; font-size: 15px; background: transparent; color: var(--black); border: 2px solid var(--black); padding: 12px 28px; text-decoration: none; transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
  .btn:hover { background: var(--black); color: var(--white); font-style: italic; }

  header { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: var(--white); border-bottom: 1px solid rgba(0,0,0,0.1); animation: headerFadeIn 0.6s ease both; animation-delay: 0.15s; }
  .nav-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 16px 32px; }
  @media (min-width: 900px) { .nav-row { padding: 16px 64px; } }
  nav.links { display: none; gap: 28px; font-size: 14px; justify-self: start; }
  nav.links a { text-decoration: none; }
  @media (min-width: 860px) { nav.links { display: flex; align-items: center; } }
  .logo-mark { width: 200px; height: 42px; justify-self: center; }
  .logo-mark img { width: 100%; height: 100%; object-fit: contain; }
  .header-right { display: flex; align-items: center; gap: 20px; justify-self: end; }
  .lang-switch { display: flex; gap: 6px; font-size: 13px; color: var(--charcoal); }
  .lang-switch a { text-decoration: none; }
  .lang-switch a.active { color: var(--black); font-weight: 600; }
  .header-letter { display: none; font-family: var(--serif); font-size: 13.5px; color: var(--black); border: 1px solid var(--black); padding: 6px 14px; text-decoration: none; white-space: nowrap; transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
  .header-letter:hover { background: var(--black); color: var(--white); font-style: italic; }
  @media (min-width: 1100px) { .header-letter { display: inline-block; } }
  .signed-up .header-letter, .signed-up .mobile-letter { display: none !important; }
  .menu-toggle { background: none; border: none; cursor: pointer; width: 26px; height: 18px; position: relative; padding: 0; }
  .menu-toggle span { position: absolute; left: 0; width: 100%; height: 2px; background: var(--black); }
  .menu-toggle span:nth-child(1) { top: 0; } .menu-toggle span:nth-child(2) { top: 8px; } .menu-toggle span:nth-child(3) { top: 16px; }
  @media (min-width: 860px) { .menu-toggle { display: none; } }
  .mobile-nav { display: none; flex-direction: column; background: var(--white); border-bottom: 1px solid rgba(0,0,0,0.1); padding: 8px 32px 28px; position: absolute; top: 100%; left: 0; right: 0; z-index: 49; }
  .mobile-nav.open { display: flex; }
  .mobile-nav a { font-family: var(--serif); font-size: 1.1rem; padding: 14px 0; text-decoration: none; border-bottom: 1px solid rgba(0,0,0,0.08); color: var(--black); }
  @media (min-width: 860px) { .mobile-nav { display: none !important; } }

  .back-link-row { padding: 96px 0 0; }
  .back-link { text-decoration: none; font-size: 14px; color: var(--charcoal); }
  .back-link:hover { color: var(--black); }

  .product-gallery { position: relative; width: 100%; height: 72vh; min-height: 460px; margin-top: 24px; overflow: hidden; background: var(--charcoal); }
  .product-gallery .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease; }
  .product-gallery .slide.active { opacity: 1; }
  .product-gallery .slide img, .product-gallery .slide video { width: 100%; height: 100%; object-fit: cover; }
  .gallery-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--white); font-size: 2.5rem; font-family: var(--serif); cursor: pointer; padding: 12px 20px; z-index: 5; text-shadow: 0 1px 6px rgba(0,0,0,0.4); }
  .gallery-arrow.prev { left: 8px; } .gallery-arrow.next { right: 8px; }
  .gallery-dots { position: absolute; bottom: 16px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; z-index: 5; }
  .gallery-dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.5); }
  .gallery-dots span.active { background: var(--white); }

  .product-body { padding: 56px 0 100px; }
  .product-grid { display: grid; grid-template-columns: 1fr; gap: 48px; }
  @media (min-width: 900px) { .product-grid { grid-template-columns: 1.3fr 1fr; gap: 72px; } }
  .product-title-row .type-badge { font-family: var(--sans); font-size: 13px; color: var(--charcoal); }
  .product-title-row h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(1.9rem, 3.6vw, 2.6rem); margin-top: 10px; }
  .product-title-row .edition-line { font-family: var(--serif); font-style: italic; font-size: 0.95rem; color: var(--charcoal); margin-top: 10px; }
  .product-desc { margin-top: 28px; color: #2b2b2b; max-width: 560px; }
  .product-desc p + p { margin-top: 16px; }
  .product-desc h3 { font-family: var(--serif); font-weight: 500; font-size: 1.3rem; margin: 36px 0 12px; }
  .product-desc ol, .product-desc ul { margin: 12px 0 18px 1.2em; }
  .product-desc li + li { margin-top: 8px; }
  .specs-box { border-top: 1px solid var(--black); padding-top: 24px; }
  .price-line { font-family: var(--serif); font-size: 2rem; font-weight: 300; margin-bottom: 24px; }
  .price-line .price-suffix { font-size: 1rem; color: var(--charcoal); font-family: var(--sans); }
  .specs-table { width: 100%; font-size: 0.95rem; }
  .specs-table tr { border-bottom: 1px solid rgba(0,0,0,0.1); }
  .specs-table td { padding: 12px 0; }
  .specs-table td:first-child { color: var(--charcoal); width: 40%; }
  .yearly-line { margin-top: 16px; font-family: var(--serif); font-style: italic; font-size: 0.98rem; color: var(--charcoal); }
  .yearly-line a { color: var(--black); text-decoration: underline; text-underline-offset: 3px; }
  .unframed-note { margin-top: 16px; font-size: 0.9rem; color: var(--charcoal); font-style: italic; }
  .specs-box .btn { margin-top: 28px; width: 100%; text-align: center; }

  footer { background: var(--black); color: var(--white); padding: 64px 0 32px; }
  .footer-bottom { font-size: 12.5px; color: rgba(255,255,255,0.55); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

  /* Product hero: a full-height slideshow under a transparent header, title at its foot.
     Each picture keeps its own shape at full height; a portrait picture or video sits in the middle
     with the edges of the previous and next pictures showing on either side, never blank space. */
  .product-hero { position: relative; height: 100vh; height: 100svh; min-height: 520px; overflow: hidden; background: #e9e4dc; }
  .ph-track { position: absolute; top: 0; bottom: 0; left: 0; display: flex; gap: 3px; will-change: transform; }
  .ph-track.animate { transition: transform 0.9s cubic-bezier(.65,.05,.25,1); }
  .ph-track .slide { position: relative; flex: 0 0 auto; height: 100%; overflow: hidden; opacity: 1; }
  .ph-track .slide img, .ph-track .slide video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph-track .slide:not(.current)::after { content: ""; position: absolute; inset: 0; background: rgba(245,241,234,0.28); transition: background 0.6s ease; }
  .ph-shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.08) 40%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.25) 100%); }
  .ph-title { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 24px 64px; text-align: center; color: var(--white); pointer-events: none; }
  .ph-title .type-badge { color: rgba(255,255,255,0.85); }
  .ph-title h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.15; max-width: 900px; margin: 10px auto 0; color: var(--white); }
  .product-hero .gallery-arrow { z-index: 6; text-shadow: 0 1px 8px rgba(0,0,0,0.35); }
  .product-hero .gallery-dots { bottom: 26px; z-index: 6; }
  .product-hero.single .gallery-arrow, .product-hero.single .gallery-dots { display: none; }
  .back-link-row { padding: 28px 0 0; }
  header { transition: background-color 0.3s ease, border-color 0.3s ease; }
  body.hero-dark header:not(.scrolled) { background: transparent; border-bottom-color: transparent; }
  /* Pages with a full-bleed hero: white logo and navigation until the header turns solid on scroll */
  body.hero-dark header:not(.scrolled) nav.links a,
  body.hero-dark header:not(.scrolled) .lang-switch,
  body.hero-dark header:not(.scrolled) .lang-switch a,
  body.hero-dark header:not(.scrolled) .lang-switch a.active { color: var(--white); }
  body.hero-dark header:not(.scrolled) nav.links a:hover { border-color: var(--white); }
  body.hero-dark header:not(.scrolled) .logo-mark img { filter: brightness(0) invert(1); }
  body.hero-dark header:not(.scrolled) .menu-toggle span { background: var(--white); }
  body.hero-dark header:not(.scrolled) .header-letter { color: var(--white); border-color: var(--white); }
  body.hero-dark header:not(.scrolled) .header-letter:hover { background: rgba(255,255,255,0.14); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-color: transparent; color: var(--white); font-style: italic; }
  body.hero-dark header:has(.mobile-nav.open) { background: var(--white); }
  body.hero-dark header:has(.mobile-nav.open) .logo-mark img { filter: none; }
  body.hero-dark header:has(.mobile-nav.open) .menu-toggle span { background: var(--black); }
  body.hero-dark header:has(.mobile-nav.open) .lang-switch, body.hero-dark header:has(.mobile-nav.open) .lang-switch a { color: var(--charcoal); }
  body.hero-dark header:has(.mobile-nav.open) .lang-switch a.active { color: var(--black); }

  /* Touch screens: first tap on a subscription button shows the price, second tap opens it */
  .sub-buttons .btn.tap-active { background: rgba(255,255,255,0.14); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-color: transparent; color: var(--white); font-style: italic; }
  .sub-buttons .btn.tap-active .lbl { opacity: 0; }
  .sub-buttons .btn.tap-active .prc { opacity: 1; }

  /* Images inside a sales page, to break up the text */
  .product-desc .embed-image { margin: 32px 0; }
  .product-desc .embed-image img { width: 100%; height: auto; display: block; }
  .product-desc .embed-image figcaption { font-size: 13px; color: var(--charcoal); font-style: italic; text-align: center; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body class="hero-dark">
<div id="scrollSentinel" style="position:absolute; top:0; height:1px; width:1px;"></div>

{{HEADER}}

<section class="product-hero" aria-roledescription="carousel">
  <div class="ph-track" id="phTrack">
  {{GALLERY_SLIDES}}
  </div>
  <div class="ph-shade"></div>
  <div class="ph-title"><p class="type-badge">{{TYPE_LABEL}}</p><h1>{{TITLE}}</h1></div>
  <button class="gallery-arrow prev" aria-label="{{GALLERY_PREV_LABEL}}">&#8249;</button>
  <button class="gallery-arrow next" aria-label="{{GALLERY_NEXT_LABEL}}">&#8250;</button>
  <div class="gallery-dots">{{GALLERY_DOTS}}</div>
</section>

<div class="wrap back-link-row">
  <a href="/{{LANG}}/catalogue.html" class="back-link">&#8592; Back to Available Art</a>
</div>

<div class="wrap product-body">
  <div class="product-grid">
    <div>
      <div class="product-title-row">
        {{EDITION_LINE}}
      </div>
      <div class="product-desc">{{DESCRIPTION}}</div>
    </div>
    <div class="specs-box">
      {{PRICE_LINE}}
      <table class="specs-table">
        {{SIZE_ROW}}
        {{MATERIAL_ROW}}
        {{MEDIUM_ROW}}
        {{THEME_ROW}}
      </table>
      {{UNFRAMED_NOTE}}
      {{BUY_BLOCK}}
      {{YEARLY_LINE}}
    </div>
  </div>
</div>

{{FOOTER}}

<script>
  (function () {
    var header = document.querySelector('header');
    var sentinel = document.getElementById('scrollSentinel');
    if (sentinel) {
      var observer = new IntersectionObserver(function (entries) {
        header.classList.toggle('scrolled', !entries[0].isIntersecting);
      }, { threshold: 0 });
      observer.observe(sentinel);
    }
    var toggle = document.getElementById('menuToggle');
    var mobileNav = document.getElementById('mobileNav');
    if (toggle && mobileNav) {
      toggle.addEventListener('click', function () {
        toggle.classList.toggle('open');
        mobileNav.classList.toggle('open');
      });
    }
  })();
  (function () {
    // Full-height slideshow. Slides are laid out side by side at their own proportions; the current one is centred.
    // The set is repeated on both sides so there is always a neighbour to show, even with a single picture.
    var hero = document.querySelector('.product-hero');
    var track = document.getElementById('phTrack');
    if (!hero || !track) return;
    var originals = [].slice.call(track.querySelectorAll('.slide'));
    var n = originals.length;
    var dots = [].slice.call(hero.querySelectorAll('.gallery-dots span'));
    if (n < 2) hero.classList.add('single');
    originals.forEach(function (s) { s.classList.remove('active'); });
    // three copies: [before][originals][after]
    var before = originals.map(function (s) { var c = s.cloneNode(true); c.setAttribute('aria-hidden', 'true'); return c; });
    var after = originals.map(function (s) { var c = s.cloneNode(true); c.setAttribute('aria-hidden', 'true'); return c; });
    before.forEach(function (c) { track.insertBefore(c, originals[0]); });
    after.forEach(function (c) { track.appendChild(c); });
    var all = [].slice.call(track.querySelectorAll('.slide'));
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    all.forEach(function (s, i) { var v = s.querySelector('video'); if (!v) return; v.loop = (n < 2 || reduceMotion); if (i < n || i >= 2 * n) v.preload = 'metadata'; });
    var index = n; // first original
    var ratios = all.map(function () { return 0.75; });

    function mediaOf(s) { return s.querySelector('img, video'); }
    function ratioOf(m) {
      if (m.tagName === 'VIDEO') return m.videoWidth && m.videoHeight ? m.videoWidth / m.videoHeight : 9 / 16;
      return m.naturalWidth && m.naturalHeight ? m.naturalWidth / m.naturalHeight : 0.75;
    }
    function layout(animate) {
      var H = hero.clientHeight, W = hero.clientWidth;
      all.forEach(function (s, i) {
        var w = Math.min(H * ratios[i], W);   // landscape pictures fill the width; portrait ones keep their shape
        s.style.width = Math.round(w) + 'px';
      });
      var cur = all[index];
      var x = cur.offsetLeft + cur.offsetWidth / 2 - W / 2;
      track.classList.toggle('animate', !!animate);
      track.style.transform = 'translateX(' + (-x) + 'px)';
      all.forEach(function (s, i) { s.classList.toggle('current', i === index); });
      dots.forEach(function (d, i) { d.classList.toggle('active', i === (index % n)); });
      // only the centred video plays
      all.forEach(function (s, i) { var v = s.querySelector('video'); if (!v) return; if (i === index) { v.currentTime = 0; v.play().catch(function () {}); } else v.pause(); });
    }
    all.forEach(function (s, i) {
      var m = mediaOf(s); if (!m) return;
      var set = function () { ratios[i] = ratioOf(m); layout(false); };
      if (m.tagName === 'VIDEO') { if (m.readyState >= 1) set(); else m.addEventListener('loadedmetadata', set, { once: true }); }
      else { if (m.complete && m.naturalWidth) set(); else m.addEventListener('load', set, { once: true }); }
    });
    function go(to) {
      index = to; layout(true);
      clearTimeout(timer); schedule();
    }
    track.addEventListener('transitionend', function () {
      // after moving into a copy, jump back to the matching original without animation
      if (index < n || index >= 2 * n) { index = n + ((index % n) + n) % n; layout(false); }
    });
    hero.querySelector('.gallery-arrow.prev').addEventListener('click', function () { go(index - 1); });
    hero.querySelector('.gallery-arrow.next').addEventListener('click', function () { go(index + 1); });
    dots.forEach(function (d, i) { d.style.cursor = 'pointer'; d.addEventListener('click', function () { go(n + i); }); });
    var x0 = null;
    hero.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
    hero.addEventListener('touchend', function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) go(index + (dx < 0 ? 1 : -1)); x0 = null; });
    // gentle autoplay: a picture stays 6 seconds, a video plays once through
    var timer = null;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function schedule() {
      if (n < 2 || reduce) return;
      var v = all[index].querySelector('video');
      var wait = v && v.duration ? Math.max(v.duration * 1000, 4000) : 6000;
      timer = setTimeout(function () { if (!document.hidden) go(index + 1); else schedule(); }, wait);
    }
    window.addEventListener('resize', function () { layout(false); });
    layout(false); schedule();
  })();
</script>
</body>
</html>
